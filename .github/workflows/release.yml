name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.4)'
        required: false
        default: 'v1.0.4'

permissions:
  contents: write

jobs:
  # ============================================================
  # Windows Portable ZIP Build
  # ============================================================
  build-windows-portable:
    name: Build Windows Portable ZIP
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (for build script)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Determine version
        id: version
        shell: bash
        run: |
          RAW="${{ inputs.tag_name }}"
          if [ -z "$RAW" ]; then
            RAW="${GITHUB_REF_NAME}"
          fi
          VERSION="${RAW#v}"
          TAG="v${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Run Windows Portable build script
        shell: python
        run: |
          import subprocess, sys
          subprocess.run(
              [sys.executable, "scripts/build_windows_portable.py",
               "--version", "${{ steps.version.outputs.VERSION }}"],
              check=True
          )

      - name: Upload Windows Portable ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            dist/WhatsAppMediaOrganizer-v${{ steps.version.outputs.VERSION }}-Windows-Portable.zip
            dist/WhatsAppMediaOrganizer-v${{ steps.version.outputs.VERSION }}-Windows-Portable.zip.sha256

  # ============================================================
  # Unix Source Archive (macOS + Linux companion scripts)
  # ============================================================
  build-unix-source:
    name: Build Unix Source Archive
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          RAW="${{ inputs.tag_name }}"
          if [ -z "$RAW" ]; then
            RAW="${GITHUB_REF_NAME}"
          fi
          VERSION="${RAW#v}"
          TAG="v${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Make shell scripts executable
        run: |
          chmod +x start_gallery.sh install.sh

      - name: Validate shell script syntax
        run: |
          bash -n start_gallery.sh
          bash -n install.sh
          echo "[OK] POSIX shell syntax validated"

      - name: Run Python unit tests
        run: |
          python3 -m venv venv
          ./venv/bin/pip install -q -r requirements.txt
          ./venv/bin/python -m unittest discover tests
          echo "[OK] All unit tests passed"

      - name: Create Unix source archive
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          ARCHIVE_NAME="WhatsAppMediaOrganizer-v${VERSION}-Unix-Source.tar.gz"
          STAGING="build/unix-staging/WhatsAppMediaOrganizer-v${VERSION}"
          mkdir -p "$STAGING"

          # Copy source files
          cp -r core wa_media_organizer.py gallery.html requirements.txt README.md "$STAGING/"
          cp start_gallery.sh install.sh "$STAGING/"
          chmod +x "$STAGING/start_gallery.sh" "$STAGING/install.sh"

          # Clean bytecode/cache before packaging
          find "$STAGING" -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find "$STAGING" -type f -name "*.pyc" -delete 2>/dev/null || true
          find "$STAGING" -type f -name "*.pyo" -delete 2>/dev/null || true

          # Write clean config.json
          cat > "$STAGING/config.json" << 'EOF'
          {
            "hex_key": "",
            "mode": "copy",
            "port": 8000,
            "output_dir": "./output",
            "onboarding_completed": false
          }
          EOF

          # Create archive
          mkdir -p dist
          tar -czf "dist/${ARCHIVE_NAME}" -C "build/unix-staging" "WhatsAppMediaOrganizer-v${VERSION}"
          SHA256=$(sha256sum "dist/${ARCHIVE_NAME}" | awk '{print $1}')
          echo "${SHA256}  ${ARCHIVE_NAME}" > "dist/${ARCHIVE_NAME}.sha256"
          echo "[OK] Archive: ${ARCHIVE_NAME} (SHA256: ${SHA256})"

      - name: Upload Unix Source archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: unix-source
          path: |
            dist/WhatsAppMediaOrganizer-v${{ steps.version.outputs.VERSION }}-Unix-Source.tar.gz
            dist/WhatsAppMediaOrganizer-v${{ steps.version.outputs.VERSION }}-Unix-Source.tar.gz.sha256

  # ============================================================
  # Create GitHub Release with all assets
  # ============================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows-portable, build-unix-source]

    steps:
      - name: Determine version
        id: version
        run: |
          RAW="${{ inputs.tag_name }}"
          if [ -z "$RAW" ]; then
            RAW="${GITHUB_REF_NAME}"
          fi
          VERSION="${RAW#v}"
          TAG="v${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Read checksums
        id: checksums
        run: |
          WIN_SHA=$(cat dist-artifacts/windows-portable/*.sha256 | awk '{print $1}')
          UNIX_SHA=$(cat dist-artifacts/unix-source/*.sha256 | awk '{print $1}')
          echo "WIN_SHA=${WIN_SHA}" >> "$GITHUB_OUTPUT"
          echo "UNIX_SHA=${UNIX_SHA}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "WhatsApp Offline Media Gallery ${{ steps.version.outputs.TAG }} - Windows Portable"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## WhatsApp Offline Media Gallery ${{ steps.version.outputs.TAG }}

            > Browse, search, and export your WhatsApp photos, videos, and documents — fully offline, private, and organized.

            ---

            ### Download

            | Platform | File | SHA256 |
            | :--- | :--- | :--- |
            | **Windows** (zero-install portable) | [WhatsAppMediaOrganizer-v${{ steps.version.outputs.VERSION }}-Windows-Portable.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.TAG }}/WhatsAppMediaOrganizer-v${{ steps.version.outputs.VERSION }}-Windows-Portable.zip) | `${{ steps.checksums.outputs.WIN_SHA }}` |
            | **macOS / Linux** (source + scripts) | [WhatsAppMediaOrganizer-v${{ steps.version.outputs.VERSION }}-Unix-Source.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.TAG }}/WhatsAppMediaOrganizer-v${{ steps.version.outputs.VERSION }}-Unix-Source.tar.gz) | `${{ steps.checksums.outputs.UNIX_SHA }}` |

            ---

            ### Windows Quick Start (zero-install)
            1. Download [WhatsAppMediaOrganizer-v${{ steps.version.outputs.VERSION }}-Windows-Portable.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.TAG }}/WhatsAppMediaOrganizer-v${{ steps.version.outputs.VERSION }}-Windows-Portable.zip)
            2. Right-click the ZIP -> **Extract All** (to any folder)
            3. Double-click **Start-Gallery.bat**
            4. Browser opens automatically with the interactive setup guide

            > [!NOTE]
            > The ZIP includes embedded Python 3.13, Google ADB, and all dependencies. No installation required.

            ### macOS / Linux Quick Start
            ```bash
            tar -xzf WhatsAppMediaOrganizer-v${{ steps.version.outputs.VERSION }}-Unix-Source.tar.gz
            cd WhatsAppMediaOrganizer-v${{ steps.version.outputs.VERSION }}
            ./install.sh        # one-time setup (creates Python venv + installs deps)
            ./start_gallery.sh  # launch
            ```

          files: |
            dist-artifacts/windows-portable/WhatsAppMediaOrganizer-v${{ steps.version.outputs.VERSION }}-Windows-Portable.zip
            dist-artifacts/windows-portable/WhatsAppMediaOrganizer-v${{ steps.version.outputs.VERSION }}-Windows-Portable.zip.sha256
            dist-artifacts/unix-source/WhatsAppMediaOrganizer-v${{ steps.version.outputs.VERSION }}-Unix-Source.tar.gz
            dist-artifacts/unix-source/WhatsAppMediaOrganizer-v${{ steps.version.outputs.VERSION }}-Unix-Source.tar.gz.sha256
